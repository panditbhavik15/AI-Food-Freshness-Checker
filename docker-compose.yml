version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=sqlite:///./freshness.db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - ML_DEV_MODE=true
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
    volumes:
      - backend_uploads:/app/uploads
      - backend_db:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  backend_uploads:
  backend_db:
